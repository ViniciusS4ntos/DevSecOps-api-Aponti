version: '3.8'

services:
  # 1. Banco de Dados PostgreSQL (sua dependência "pg" e "typeorm")
  postgres:
    image: postgres:15-alpine
    container_name: flash_sales_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: flashsales
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - flash-network

  # 2. Redis (sua dependência "ioredis")
  redis:
    image: redis:7-alpine
    container_name: flash_sales_redis
    ports:
      - "6379:6379"
    networks:
      - flash-network

volumes:
  pgdata:

networks:
  flash-network:
    driver: bridge